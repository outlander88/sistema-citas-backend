<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Citas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1, h2 { text-align: center; color: #333; }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .mensaje { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
        .exito { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        ul { list-style-type: none; padding: 0; }
        li {
            background: #e9ecef;
            margin: 8px 0;
            padding: 12px;
            border-radius: 5px;
            border-left: 5px solid #007bff;
        }
    </style>
</head>
<body>

    <h1>Gestión de Citas</h1>

    <div class="card">
        <h2>Agendar Nueva Cita</h2>
        <form id="formCita">
            <label for="idUsuario">ID de Usuario:</label>
            <input type="number" id="idUsuario" required value="1">

            <label for="idServicio">ID de Servicio:</label>
            <input type="number" id="idServicio" required value="1">

            <label for="fechaHora">Fecha y Hora:</label>
            <input type="datetime-local" id="fechaHora" required>

            <label for="observaciones">Observaciones:</label>
            <textarea id="observaciones" rows="3" placeholder="Motivo de la cita..."></textarea>

            <button type="submit">Agendar Cita</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <div class="card">
        <h2>Mis Citas Agendadas</h2>
        <button id="btnCargar">Consultar Citas (Usuario ID: 1)</button>
        <ul id="listaCitas"></ul>
    </div>

    <script>
        document.getElementById('formCita').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.display = 'none';

            const citaData = {
                idUsuario: parseInt(document.getElementById('idUsuario').value),
                idServicio: parseInt(document.getElementById('idServicio').value),
                fechaHora: document.getElementById('fechaHora').value,
                estado: "Pendiente",
                observaciones: document.getElementById('observaciones').value
            };

            try {
                const response = await fetch('/api/citas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(citaData)
                });

                if (response.ok) {
                    mensajeDiv.className = 'mensaje exito';
                    mensajeDiv.innerText = '¡Cita agendada con éxito!';
                    document.getElementById('formCita').reset();
                    cargarCitas();
                } else {
                    const errorText = await response.text();
                    mensajeDiv.className = 'mensaje error';
                    mensajeDiv.innerText = 'Error: ' + errorText;
                }
            } catch (error) {
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.innerText = 'Error al conectar con el servidor.';
            }
            mensajeDiv.style.display = 'block';
        });

        async function cargarCitas() {
            const idUsuario = document.getElementById('idUsuario').value || 1;
            const lista = document.getElementById('listaCitas');
            lista.innerHTML = 'Cargando...';

            try {
                const response = await fetch(`/api/citas/usuario/${idUsuario}`);
                const citas = await response.json();
                lista.innerHTML = '';

                if (citas.length === 0) {
                    lista.innerHTML = '<li>No hay citas registradas para este usuario.</li>';
                    return;
                }

                citas.forEach(cita => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>Fecha:</strong> ${cita.fechaHora.replace('T', ' ')} <br>
                                    <strong>Servicio ID:</strong> ${cita.idServicio} | 
                                    <strong>Estado:</strong> ${cita.estado} <br>
                                    <strong>Nota:</strong> ${cita.observaciones || 'Sin observaciones'}`;
                    lista.appendChild(li);
                });
            } catch (error) {
                lista.innerHTML = '<li>Error al obtener la lista de citas.</li>';
            }
        }

        document.getElementById('btnCargar').addEventListener('click', cargarCitas);
    </script>
</body>
</html>
